<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find the circle</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#eee;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:grid;grid-template-rows:1fr auto;padding-top:env(safe-area-inset-top,0px)}
#stage{position:relative;min-height:0}
canvas{width:100%;height:100%;object-fit:contain;display:block}
video{display:none}
#hud{position:absolute;top:8px;left:10px;font-size:13px;color:#cbd5e1;text-shadow:0 1px 3px #000}
#dir{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:clamp(22px,6vw,44px);font-weight:700;text-shadow:0 2px 8px #000}
#ov{position:absolute;inset:0;background:#0b0f14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#ov[hidden]{display:none}
#ov p{max-width:440px;color:#9aa7b8;margin:0}
button{background:#e8590c;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:#27303b}
select{background:#27303b;color:#eee;border:0;border-radius:6px;padding:6px;max-width:44vw}
#bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#10151c;font-size:12px}
#err{color:#f87171}
</style></head><body>
<div id="stage"><canvas id="cv"></canvas><video id="vid" playsinline muted></video>
<div id="hud"></div><div id="dir"></div>
<div id="ov"><h2 style="margin:0">Find the hidden circle</h2>
<p>A red circle is hidden somewhere in the camera view. Move your hand and follow the spoken and on-screen directions. Hold your hand inside the circle to finish the round.</p>
<button id="go">Start camera</button><p id="err"></p></div></div>
<div id="bar">
<select id="cam"></select>
<select id="which"><option>Right</option><option>Left</option><option>Any</option></select>
<label><input type="checkbox" id="voice" checked> Voice</label>
<label><input type="checkbox" id="tone"> Proximity tone</label>
<label><input type="checkbox" id="show"> Show circle</label>
<label><input type="checkbox" id="mir" checked> Mirror</label>
<label><input type="checkbox" id="flip" checked> Flip hand labels</label>
<button class="g" id="skip">New round</button>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),vid=$('vid');
let lm=null,stream=null,W=640,H=480,lastT=-1,lastFrame=performance.now(),osc=null,gain=null;
const G={c:null,state:'search',hand:null,pts:null,dwell:0,t0:0,rounds:0,best:null,lastSpeak:0,lastMsg:'',nextAt:0,last:0};

function say(t){if(!$('voice').checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.15;speechSynthesis.speak(u)}

async function startCam(id){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 const v={width:{ideal:1280},height:{ideal:720}};
 stream=await navigator.mediaDevices.getUserMedia({video:id?{...v,deviceId:{exact:id}}:{...v,facingMode:'user'},audio:false});
 vid.srcObject=stream;await vid.play();
 W=vid.videoWidth;H=vid.videoHeight;cv.width=W;cv.height=H;
 const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
 $('cam').innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}">${d.label||'Camera '+(i+1)}</option>`).join('');
 const cur=stream.getVideoTracks()[0].getSettings().deviceId;if(cur)$('cam').value=cur;
}
async function loadModel(){
 const f=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
 const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:2});
 try{lm=await HandLandmarker.createFromOptions(f,o('GPU'))}catch(e){lm=await HandLandmarker.createFromOptions(f,o('CPU'))}
}
function newRound(){
 const r=.12*H;let c;
 for(let i=0;i<50;i++){c={x:r+W*.05+Math.random()*(W-2*r-W*.1),y:r+H*.05+Math.random()*(H-2*r-H*.1),r};
  if(!G.hand||Math.hypot(c.x-G.hand.x,c.y-G.hand.y)>3*r)break}
 G.c=c;G.state='search';G.dwell=0;G.t0=performance.now();G.lastMsg='';G.lastSpeak=0;
 say('New target. Find the circle with your hand.');
}
const mx=x=>$('mir').checked?(1-x)*W:x*W;
function detect(){
 const res=lm.detectForVideo(vid,performance.now()),want=$('which').value;let pick=null;
 res.landmarks.forEach((l,i)=>{let lab=res.handedness[i][0].categoryName;
  if($('flip').checked)lab=lab==='Left'?'Right':'Left';
  if(!pick&&(want==='Any'||lab===want))pick=l});
 if(!pick){G.hand=null;G.pts=null;return}
 G.pts=pick.map(p=>({x:mx(p.x),y:p.y*H}));
 const ids=[0,5,9,13,17],px=ids.reduce((s,i)=>s+G.pts[i].x,0)/5,py=ids.reduce((s,i)=>s+G.pts[i].y,0)/5;
 G.hand=G.hand?{x:G.hand.x*.5+px*.5,y:G.hand.y*.5+py*.5}:{x:px,y:py};
}
function guide(){
 const w=$('which').value==='Any'?'':$('which').value.toLowerCase()+' ';
 if(!G.hand)return'Show your '+w+'hand to the camera';
 const dx=G.c.x-G.hand.x,dy=G.c.y-G.hand.y,d=Math.hypot(dx,dy)/H,ax=Math.abs(dx),ay=Math.abs(dy);
 const adv=d>.4?'a lot ':d>.18?'':'slightly ',hz=dx<0?'left':'right',vt=dy<0?'up':'down';
 const m=ax>1.8*ay?hz:ay>1.8*ax?vt:vt+' and '+hz;
 return'Move '+adv+m;
}
function step(){
 const now=performance.now(),dt=now-G.last;G.last=now;
 if(G.state==='found'){if(now>G.nextAt)newRound();$('dir').textContent='Got it!';tone(0);return}
 const msg=guide();$('dir').textContent=msg;
 if((msg!==G.lastMsg&&now-G.lastSpeak>1100)||now-G.lastSpeak>3500){say(msg);G.lastSpeak=now;G.lastMsg=msg}
 if(G.hand){
  const d=Math.hypot(G.c.x-G.hand.x,G.c.y-G.hand.y);
  G.dwell=d<G.c.r?G.dwell+dt:0;
  if(G.dwell>300){const s=(now-G.t0)/1000;G.state='found';G.rounds++;G.best=G.best==null?s:Math.min(G.best,s);G.nextAt=now+2500;say('Got it! '+s.toFixed(1)+' seconds');}
  const close=1-Math.min(1,d/(.8*H));tone(close,now);
 }else tone(0);
 $('hud').textContent=`Round ${G.rounds+1} · ${((now-G.t0)/1000).toFixed(1)} s`+(G.best!=null?` · best ${G.best.toFixed(1)} s`:'');
}
function tone(close,now){
 if(!gain)return;
 if(!$('tone').checked||close<=0){gain.gain.value=0;return}
 osc.frequency.value=250+close*900;
 gain.gain.value=Math.floor(now/(520-close*400))%2?.05:0;
}
function draw(){
 ctx.save();if($('mir').checked){ctx.translate(W,0);ctx.scale(-1,1)}ctx.drawImage(vid,0,0,W,H);ctx.restore();
 ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(0,0,W,H);
 if(G.pts){
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;
  for(const c of HandLandmarker.HAND_CONNECTIONS){const a=G.pts[c.start],b=G.pts[c.end];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
 const found=G.state==='found';
 if(G.c&&($('show').checked||found)){
  ctx.beginPath();ctx.arc(G.c.x,G.c.y,G.c.r,0,7);
  ctx.fillStyle=found?'rgba(34,197,94,.6)':'rgba(239,68,68,.45)';ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle=found?'#22c55e':'#ef4444';ctx.stroke();
 }
 if(G.hand){
  ctx.beginPath();ctx.arc(G.hand.x,G.hand.y,14,0,7);ctx.lineWidth=4;ctx.strokeStyle='#38bdf8';ctx.stroke();
  if(!found){
   const dx=G.c.x-G.hand.x,dy=G.c.y-G.hand.y,dist=Math.hypot(dx,dy),a=Math.atan2(dy,dx),len=Math.min(H*.25,dist*.6)+30,
    ex=G.hand.x+Math.cos(a)*len,ey=G.hand.y+Math.sin(a)*len;
   ctx.strokeStyle='#fbbf24';ctx.fillStyle='#fbbf24';ctx.lineWidth=6;
   ctx.beginPath();ctx.moveTo(G.hand.x+Math.cos(a)*20,G.hand.y+Math.sin(a)*20);ctx.lineTo(ex,ey);ctx.stroke();
   ctx.beginPath();ctx.moveTo(ex+Math.cos(a)*18,ey+Math.sin(a)*18);
   ctx.lineTo(ex+Math.cos(a+2.5)*18,ey+Math.sin(a+2.5)*18);ctx.lineTo(ex+Math.cos(a-2.5)*18,ey+Math.sin(a-2.5)*18);ctx.fill();
  }
 }
}
function loop(){
 requestAnimationFrame(loop);
 if(vid.readyState>=2&&vid.currentTime!==lastT){lastT=vid.currentTime;detect()}
 step();draw();
}
$('go').onclick=async()=>{
 $('go').disabled=true;$('go').textContent='Loading…';$('err').textContent='';say('Starting');
 try{
  const ac=new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gain=ac.createGain();gain.gain.value=0;osc.connect(gain).connect(ac.destination);osc.start();
  await startCam();await loadModel();
  try{await navigator.wakeLock.request('screen')}catch(e){}
  $('ov').hidden=true;newRound();loop();
 }catch(e){$('err').textContent='Could not start: '+e.message+' (camera needs HTTPS and permission)';$('go').disabled=false;$('go').textContent='Try again'}
};
$('cam').onchange=()=>startCam($('cam').value);
$('skip').onclick=()=>newRound();
</script></body></html>
